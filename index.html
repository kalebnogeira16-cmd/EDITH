<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDITH</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121214">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121214;
            color: #e1e1e6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a1e;
            border-bottom: 1px solid #29292e;
        }
        .status {
            font-size: 12px;
            color: #00b37e;
        }
        .chat-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            background: #202024;
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            line-align: 1.4;
        }
        .input-area {
            padding: 16px;
            background: #1a1a1e;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #29292e;
        }
        input {
            flex: 1;
            background: #121214;
            border: 1px solid #29292e;
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            outline: none;
        }
        button {
            background: #00b37e;
            border: none;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <strong>EDITH</strong>
        <span class="status">pronta</span>
    </header>
    <div class="chat-container">
        <div class="message">Oi, Kaleb. Toque no microfone e fale comigo.</div>
    </div>
    <div class="input-area">
        <input type="text" placeholder="Fale com a EDITH">
        <button>🎤</button>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
